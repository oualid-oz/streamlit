[project]
name = "awp-gabarit"
version = "0.1.0"
description = "CODA Orléans, M2-D : Applications web de données avec Python"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.5.0",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "fastapi>=0.163.1",
    "joblib>=1.6.0",
    "mcp>=1.30,<2",
    "openai>=3.52.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.5"]

[tool.pytest.ini_options]
pythonpath = ["fil_rouge"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["data", "figures"]
